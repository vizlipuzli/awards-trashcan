server {
    listen 80;
    server_name awards.trashcan.lan;
    root /opt/awards-trashcan/web;
    index index.html;

    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Vendored three.js — immutable, pinned to one version.
    location /lib/ {
        alias /opt/awards-trashcan/web/lib/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
