<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Награда</title>
<style>
  :root { --panel: 300px; --line: #1e2b1c; --ink: #9ab894; --dim: #5d7a58; }
  html, body { margin: 0; height: 100%; background: #07090a; overflow: hidden;
    font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); }
  canvas { display: block; position: absolute; top: 0; }

  #panel { position: fixed; left: 0; top: 0; bottom: 0; width: var(--panel);
    background: #0b0f0c; border-right: 1px solid var(--line);
    overflow-y: auto; overscroll-behavior: contain; padding: 12px 12px 40px; box-sizing: border-box; }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: #1e2b1c; }

  h2 { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
    margin: 18px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); font-weight: 400; }
  h2:first-child { margin-top: 0; }

  .row { display: grid; grid-template-columns: 1fr 58px; gap: 6px; align-items: center; margin: 5px 0; }
  .row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; height: 3px; margin: 1px 0 4px;
    -webkit-appearance: none; appearance: none; background: var(--line); border-radius: 2px; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px;
    border-radius: 50%; background: #7bd45f; cursor: pointer; }
  .row input[type=number], .row select { background: #121a12; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 2px 4px; font: inherit; width: 100%; box-sizing: border-box; }
  .row input[type=color] { grid-column: 2; width: 100%; height: 20px; padding: 0; border: 1px solid var(--line);
    background: none; border-radius: 3px; cursor: pointer; }

  button { background: #121a12; color: var(--ink); border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 8px; font: inherit; cursor: pointer; letter-spacing: .1em; text-transform: uppercase; }
  button:hover { border-color: #3f5c3a; color: #cfe3c9; }
  button.on { background: #1d3a17; border-color: #4e7d44; color: #cfe3c9; }
  .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
  .bar.one { grid-template-columns: 1fr; }

  #swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 5px; margin: 8px 0 20px; }
  .sw { height: 26px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; position: relative; }
  .sw.sel { outline: 2px solid #7bd45f; outline-offset: 1px; }
  .sw span { position: absolute; left: -2px; right: -2px; bottom: -13px; text-align: center; font-size: 8px;
    color: var(--dim); letter-spacing: .04em; overflow: hidden; }

  #artbox { border: 1px solid var(--line); border-radius: 3px; background: #fff;
    overflow: hidden; min-height: 60px; display: grid; place-items: center; }
  #artbox img { display: block; width: 100%; height: auto; }
  #artbox.over { outline: 2px dashed #7bd45f; outline-offset: -3px; }
  .cap { color: var(--dim); margin: 5px 0 0; }
  .cap b { color: #7bd45f; font-weight: 400; }
  .warn { color: #d8a33a; }
  label.file { display: block; text-align: center; }
  label.file input { display: none; }

  #note { color: var(--dim); margin: 6px 0 0; }
  #note b { color: #7bd45f; font-weight: 400; }
  textarea { width: 100%; height: 130px; background: #121a12; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; font: inherit; padding: 6px; box-sizing: border-box; resize: vertical; }
  #err { position: fixed; left: calc(var(--panel) + 40px); top: 40%; color: #ff6b6b; max-width: 60ch;
    white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/lib/three/build/three.module.js",
    "three/addons/": "/lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { extract } from './lib/trace.js';
import { enamelGeometry } from './lib/enamel.js';
import * as C from './lib/clip.js';
import { setupLook } from './lib/look.js';

const q = new URLSearchParams(location.search);
const fail = m => { const d = document.createElement('div'); d.id = 'err'; d.textContent = m; document.body.append(d); throw new Error(m); };
/* Режим запекания: панель убрана, фон прозрачный, квадратный кадр,
   покачивание и подпрыгивание выключены — иначе петля не сойдётся
   по стыку, у них другой период. Угол ставится снаружи. */
const BAKE = q.has('bake');
const BAKE_SIZE = +(q.get('size') || 512);
const PANEL = BAKE ? 0 : 300;

/* ------------------------------------------------------------------ *
 *  Состояние: spec из файла, поверх — правки из панели
 * ------------------------------------------------------------------ */
const name = q.get('b') || 'toucan';
const base = await fetch(`./badges/${name}.json`).then(r => r.ok ? r.json() : fail(`нет ./badges/${name}.json`));
const KEY = `awards:${name}`;

const strip = o => JSON.parse(JSON.stringify(o, (k, v) => k.startsWith('//') ? undefined : v));
const merge = (a, b) => {
  const out = { ...a };
  for (const [k, v] of Object.entries(b || {}))
    out[k] = v && typeof v === 'object' && !Array.isArray(v) ? merge(a[k] || {}, v) : v;
  return out;
};
let S = strip(base);
try { const saved = localStorage.getItem(KEY); if (saved) S = merge(S, JSON.parse(saved)); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const get = p => p.split('.').reduce((o, k) => o?.[k], S);
const set = (p, v) => {
  const k = p.split('.'); const last = k.pop();
  k.reduce((o, x) => (o[x] ??= {}), S)[last] = v;
};

/* ------------------------------------------------------------------ *
 *  Сцена
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: BAKE });
if (BAKE) renderer.setClearAlpha(0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 2; controls.maxDistance = 24;

setupLook(renderer, scene, S.scene);

function backdropTexture() {
  const W = 2048, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0d0b'; x.fillRect(0, 0, W, H);
  const step = 64;
  x.lineWidth = 1; x.strokeStyle = 'rgba(80,200,90,0.10)'; x.beginPath();
  for (let i = 0; i <= W; i += step) { x.moveTo(i + .5, 0); x.lineTo(i + .5, H); }
  for (let j = 0; j <= H; j += step) { x.moveTo(0, j + .5); x.lineTo(W, j + .5); }
  x.stroke();
  x.lineWidth = 1.5; x.strokeStyle = 'rgba(80,200,90,0.20)'; x.beginPath();
  for (let i = 0; i <= W; i += step * 4) { x.moveTo(i + .5, 0); x.lineTo(i + .5, H); }
  for (let j = 0; j <= H; j += step * 4) { x.moveTo(0, j + .5); x.lineTo(W, j + .5); }
  x.stroke();
  const g = x.createRadialGradient(W / 2, H / 2, H * .12, W / 2, H / 2, H * .78);
  g.addColorStop(0, 'rgba(10,13,11,0)'); g.addColorStop(1, 'rgba(4,6,5,0.96)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
if (!BAKE) {
  const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(64, 32),
    new THREE.MeshBasicMaterial({ map: backdropTexture() }));
  backdrop.position.z = -9;
  scene.add(backdrop);
}

const badge = new THREE.Group();
const pivot = new THREE.Group();
pivot.add(badge);
scene.add(pivot);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.2, 0.4, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ------------------------------------------------------------------ *
 *  Разбор картинки. suggest даёт два числа, которые нельзя выбирать
 *  на вкус — они свойства рисунка: толщина штриха и предел ширины канта.
 * ------------------------------------------------------------------ */
const ART_KEY = `${KEY}:art`;
let img = new Image(), artNote = '';

async function setImage(src) {
  const next = new Image();
  next.src = src;
  await next.decode();
  img = next;
}

let stored = null;
try { stored = localStorage.getItem(ART_KEY); } catch {}
await setImage(stored || `./badges/${S.art}`)
  .catch(() => fail(`не читается ./badges/${S.art}`));
if (stored) artNote = 'картинка из браузера';

/* Новый рисунок — другие области и другая толщина штриха, поэтому
   раскладка цветов и всё, что было измерено по прежней картинке,
   сбрасывается: иначе цвета лягут наугад, а фаска останется от чужого
   штриха и вывернет геометрию. */
async function useImage(src, fileName) {
  try { await setImage(src); } catch { artNote = 'файл не читается как картинка'; refreshPanel(); return; }
  try { localStorage.setItem(ART_KEY, src); artNote = ''; }
  catch { artNote = 'не помещается в память браузера — пропадёт при перезагрузке'; }
  if (fileName) S.art = fileName;
  S.regions = {};
  if (S.relief?.bevel) delete S.relief.bevel.fence;
  if (S.relief) delete S.relief.minWall;
  if (S.band) { delete S.band.width; delete S.band.inset; }
  camera.userData.placed = false;
  traceArt(); build(); refreshPanel(); save();
}

let art, unit, silhouette, regions, suggest;

function traceArt() {
  const tr = { threshold: 150, minArea: 120, tolerance: 1.2, smoothing: 2, maxSize: 1100, ...(S.trace || {}) };
  const k = Math.min(1, tr.maxSize / Math.max(img.width, img.height));
  const cw = Math.round(img.width * k), ch = Math.round(img.height * k);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch);
  g.drawImage(img, 0, 0, cw, ch);

  art = extract(g.getImageData(0, 0, cw, ch), tr);
  if (!art.silhouette) fail('силуэт не найден — картинка целиком фон?');

  const xs = art.silhouette.outer.map(p => p[0]), ys = art.silhouette.outer.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  unit = (S.scale?.width ?? 2.4) / (x1 - x0);
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const T = r => r.map(([x, y]) => ({ x: (x - mx) * unit, y: (my - y) * unit }));
  const poly = s => ({ outer: T(s.outer), holes: s.holes.map(T) });

  silhouette = [poly(art.silhouette)];
  regions = art.regions.map(poly);
  suggest = { ink: art.suggest.ink * unit, merge: mergeLimit(silhouette) };

  // выведенное из рисунка подставляем только если в spec не задано
  S.relief ??= {}; S.relief.bevel ??= {};
  S.relief.bevel.fence ??= +(suggest.ink * 0.25).toFixed(4);
  S.relief.minWall ??= 0;
  if (S.band) {
    S.band.inset ??= +(suggest.ink * 0.6).toFixed(4);
    S.band.width ??= +(suggest.merge * 0.5).toFixed(4);
  }
}

/* На сколько силуэт можно раздуть, пока соседние части не слиплись.
   По формуле Штейнера площадь эквидистанты наружу равна A + P*d + pi*d^2,
   пока она сама себя не перекрыла. Как только тонкий просвет между
   частями закрывается, объединение оказывается меньше предсказанного —
   на этом и ловим. */
function mergeLimit(polys) {
  const ringArea = r => Math.abs(C.area(r));
  const per = r => { let L = 0; for (let i = 0; i < r.length; i++) {
    const a = r[i], b = r[(i + 1) % r.length]; L += Math.hypot(b.x - a.x, b.y - a.y); } return L; };
  const A = polys.reduce((s, p) => s + ringArea(p.outer) - p.holes.reduce((t, h) => t + ringArea(h), 0), 0);
  const P = polys.reduce((s, p) => s + per(p.outer) + p.holes.reduce((t, h) => t + per(h), 0), 0);
  const ok = d => {
    const g = C.offset(polys, d);
    const got = g.reduce((s, p) => s + ringArea(p.outer) - p.holes.reduce((t, h) => t + ringArea(h), 0), 0);
    return got >= (A + P * d + Math.PI * d * d) * 0.985;
  };
  let lo = 0, hi = Math.sqrt(A) * 0.5;
  if (ok(hi)) return hi;
  for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; if (ok(m)) lo = m; else hi = m; }
  return lo;
}

/* ------------------------------------------------------------------ *
 *  Материалы
 * ------------------------------------------------------------------ */
let metalMat = null, enamelMats = {};
function buildMaterials() {
  metalMat?.dispose();
  metalMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(S.metal?.color ?? '#e7b189'), metalness: 1,
    roughness: S.metal?.roughness ?? 0.24, envMapIntensity: S.metal?.envMapIntensity ?? 1.1
  });
  for (const m of Object.values(enamelMats)) m.dispose();
  enamelMats = {};
  for (const [id, e] of Object.entries(S.enamels || {}))
    enamelMats[id] = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(e.color), metalness: 0,
      roughness: e.roughness ?? 0.2, clearcoat: e.clearcoat ?? 1,
      clearcoatRoughness: e.clearcoatRoughness ?? 0.06,
      emissive: new THREE.Color(e.emissive ?? '#000000'),
      emissiveIntensity: e.emissiveIntensity ?? 0,
      envMapIntensity: e.envMapIntensity ?? 1
    });
}

/* ------------------------------------------------------------------ *
 *  Сборка: пластина -> эмаль -> приподнятое ограждение
 * ------------------------------------------------------------------ */
const shapeOf = p => {
  const s = new THREE.Shape(p.outer.map(v => new THREE.Vector2(v.x, v.y)));
  for (const h of p.holes) s.holes.push(new THREE.Path(h.map(v => new THREE.Vector2(v.x, v.y))));
  return s;
};

let cells = [], picks = [], P = null;

const enamelMesh = (poly, mat) => new THREE.Mesh(enamelGeometry(poly, {
  zBottom: P.zBase, zFloor: P.zFill, zEdge: P.zEdge, width: P.men.width, steps: P.men.steps }), mat);

function fillOf(cell, paint) {
  const mat = enamelMats[paint];
  if (!mat) return null;
  return enamelMesh(C.offset([cell.piece], P.R.tuck)[0] ?? cell.piece, mat);
}

function repaint(cell, paint) {
  if (cell.mesh) { badge.remove(cell.mesh); cell.mesh.geometry.dispose(); cell.mesh = null; }
  cell.mesh = fillOf(cell, paint);
  if (cell.mesh) badge.add(cell.mesh);
}

function build() {
  for (const o of [...badge.children]) {
    badge.remove(o); o.geometry?.dispose();
    if (o.userData.cell) o.material.dispose();
  }
  cells = []; picks = [];

  const R = { plate: 0.10, fence: 0.105, enamelDepth: 0.037, tuck: 0.006, minWall: 0.01,
              bevel: { plate: 0.012, fence: 0.004, enamel: 0.004 }, ...(S.relief || {}) };
  const zBase = R.plate, zTop = R.plate + R.fence, zFill = zTop - R.enamelDepth;
  const men = { rise: 0.75, width: 0.05, steps: 5, ...(R.meniscus || {}) };
  const zEdge = zFill + Math.max(0, Math.min(1, men.rise)) * (zTop - zFill);
  P = { R, zBase, zTop, zFill, zEdge, men };

  const solid = (p, zA, zB, bevel, mat) => {
    const bt = Math.min(bevel, (zB - zA) / 2 - 0.002);
    const geo = new THREE.ExtrudeGeometry(shapeOf(p), {
      depth: (zB - zA) - bt * 2, bevelEnabled: true, bevelThickness: bt,
      bevelSize: bevel, bevelOffset: 0, bevelSegments: 3, curveSegments: 1
    });
    geo.translate(0, 0, zA + bt);
    badge.add(new THREE.Mesh(geo, mat));
  };

  /* Кант — ВНЕШНЯЯ обводка: силуэт рисунка остаётся его внутренней
     границей, наружу нарастают полоса эмали и металлический край.
     Рисунок при этом не меняется вовсе — полем для ограждения и
     областей остаётся сам силуэт. */
  const field = silhouette;
  let outline = silhouette, ring = [];
  if (S.band && S.band.width > 0) {
    const grown = C.offset(silhouette, S.band.width);
    ring = C.subtract(grown, silhouette);
    outline = S.band.inset > 0 ? C.offset(grown, S.band.inset) : grown;
  }

  for (const p of outline) solid(p, 0, zBase, R.bevel.plate, metalMat);
  for (const p of ring) badge.add(enamelMesh(p, enamelMats[S.band?.enamel] ?? metalMat));

  const inner = R.minWall > 0 ? C.offset(field, -R.minWall) : field;
  regions.forEach((r, i) => {
    for (const piece of C.intersect([r], inner)) cells.push({ piece, index: i, mesh: null });
  });

  // ограждение: вся вырубка минус ячейки и минус полоса канта
  for (const f of C.subtract(outline, [...cells.map(c => c.piece), ...ring]))
    solid(f, zBase, zTop, R.bevel.fence, metalMat);

  for (const c of cells) {
    c.mesh = fillOf(c, (S.regions || {})[String(c.index)] ?? null);
    if (c.mesh) badge.add(c.mesh);
    if (BAKE) continue;                       // в запекаемую модель мишени не нужны
    const pick = new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(c.piece)),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
    pick.position.z = zTop + 0.004;
    pick.userData.cell = c;
    badge.add(pick); picks.push(pick);
  }

  const box = new THREE.Box3().setFromObject(badge);
  const size = new THREE.Vector3(), mid = new THREE.Vector3();
  box.getSize(size); box.getCenter(mid);
  badge.position.set(-mid.x, -mid.y, 0);
  if (!camera.userData.placed) {
    camera.position.set(0, 0, Math.max(size.x / camera.aspect, size.y) / (2 * Math.tan(Math.PI * 35 / 360)) * 1.25);
    camera.userData.placed = true;
  }
  status();
}

/* ------------------------------------------------------------------ *
 *  Панель
 * ------------------------------------------------------------------ */
const panel = document.getElementById('panel');
const note = document.createElement('p'); note.id = 'note';
const status = () => {
  note.innerHTML = `областей <b>${regions.length}</b> · залито <b>${cells.filter(c => c.mesh).length}</b>` +
    ` · мелких отброшено <b>${art.dropped}</b><br>штрих из рисунка <b>${suggest.ink.toFixed(3)}</b>` +
    ` · части слипаются с <b>${suggest.merge.toFixed(3)}</b>`;
};

let spinning = true, angle = 0;
let selected = Object.keys(S.enamels || {})[0] ?? null;

const CONTROLS = [
  ['Сцена'],
  ['scene.exposure', 'экспозиция', 0.2, 2, 0.01, 'mat'],
  ['scene.bloom', 'свечение', 0, 1, 0.01, 'post'],
  ['scene.spin', 'скорость вращения', 0, 2, 0.05, 'none'],
  ['Размер'],
  ['scale.width', 'ширина значка', 1, 5, 0.05, 'trace'],
  ['Металл'],
  ['metal.color', 'цвет', 0, 0, 0, 'mat', 'color'],
  ['metal.roughness', 'шероховатость', 0, 1, 0.01, 'mat'],
  ['metal.envMapIntensity', 'отражения', 0, 3, 0.05, 'mat'],
  ['Рельеф'],
  ['relief.plate', 'пластина', 0.02, 0.4, 0.005, 'geo'],
  ['relief.fence', 'высота ограждения', 0.02, 0.4, 0.005, 'geo'],
  ['relief.enamelDepth', 'утопление эмали', 0, 0.2, 0.002, 'geo'],
  ['relief.tuck', 'заход под стенку', 0, 0.05, 0.001, 'geo'],
  ['relief.minWall', 'стенка до канта', 0, 0.1, 0.002, 'geo'],
  ['relief.bevel.plate', 'фаска пластины', 0, 0.05, 0.001, 'geo'],
  ['relief.bevel.fence', 'фаска ограждения', 0, 0.03, 0.0005, 'geo'],
  ['Мениск эмали'],
  ['relief.meniscus.rise', 'подъём у стенки', 0, 1, 0.01, 'geo'],
  ['relief.meniscus.width', 'ширина подъёма', 0.005, 0.2, 0.005, 'geo'],
  ['relief.meniscus.steps', 'колец', 2, 10, 1, 'geo'],
  ['Кант'],
  ['band.inset', 'металл по краю', 0, 0.2, 0.002, 'geo'],
  ['band.width', 'ширина обводки', 0, 0.4, 0.002, 'geo'],
  ['band.enamel', 'эмаль', 0, 0, 0, 'geo', 'enamel'],
  ['Растр'],
  ['trace.threshold', 'порог чёрного', 40, 240, 1, 'trace'],
  ['trace.minArea', 'мин. площадь', 10, 2000, 10, 'trace'],
  ['trace.tolerance', 'упрощение', 0.2, 4, 0.1, 'trace'],
  ['trace.smoothing', 'сглаживание', 0, 4, 1, 'trace'],
  ['trace.maxSize', 'рабочий размер', 400, 2000, 50, 'trace']
];

function apply(level) {
  if (level === 'none') { save(); return; }
  if (level === 'post') { bloom.strength = S.scene?.bloom ?? 0.2; save(); return; }
  if (level === 'mat') {
    renderer.toneMappingExposure = S.scene?.exposure ?? 0.8;
    buildMaterials(); build(); save(); return;
  }
  if (level === 'trace') traceArt();
  build(); save();
}

function control([path, label, min, max, step, level, kind]) {
  const row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('label'); l.textContent = label; l.title = path;
  row.append(l);

  if (kind === 'color') {
    const c = document.createElement('input'); c.type = 'color'; c.value = get(path) || '#ffffff';
    c.oninput = () => { set(path, c.value); apply(level); };
    row.append(c);
  } else if (kind === 'enamel') {
    const s = document.createElement('select');
    for (const k of Object.keys(S.enamels || {})) s.append(new Option(k, k));
    s.value = get(path) ?? '';
    s.onchange = () => { set(path, s.value); apply(level); };
    row.append(s);
  } else {
    const n = document.createElement('input'); n.type = 'number';
    n.min = min; n.max = max; n.step = step; n.value = get(path) ?? 0;
    const r = document.createElement('input'); r.type = 'range';
    r.min = min; r.max = max; r.step = step; r.value = n.value;
    n.onchange = () => { r.value = n.value; set(path, +n.value); apply(level); };
    r.oninput = () => { n.value = r.value; set(path, +r.value); if (level === 'mat' || level === 'post') apply(level); };
    r.onchange = () => { if (level !== 'mat' && level !== 'post') apply(level); };
    row.append(n, r);
  }
  return row;
}

const artImg = document.createElement('img');
const artBox = document.createElement('div'); artBox.id = 'artbox'; artBox.append(artImg);
artBox.addEventListener('dragover', e => { e.preventDefault(); artBox.classList.add('over'); });
artBox.addEventListener('dragleave', () => artBox.classList.remove('over'));
artBox.addEventListener('drop', e => {
  e.preventDefault(); artBox.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});
function readFile(f) {
  const fr = new FileReader();
  fr.onload = () => useImage(fr.result, f.name);
  fr.readAsDataURL(f);
}

function buildPanel() {
  panel.textContent = '';

  const hi = document.createElement('h2'); hi.textContent = 'Контур'; panel.append(hi);
  artImg.src = img.src;
  panel.append(artBox);

  const pick = document.createElement('label'); pick.className = 'file';
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => { if (inp.files[0]) readFile(inp.files[0]); };
  const btn = document.createElement('button'); btn.textContent = 'загрузить рисунок';
  btn.onclick = e => { e.preventDefault(); inp.click(); };
  pick.append(inp, btn);
  const bi = document.createElement('div'); bi.className = 'bar one'; bi.append(pick);
  panel.append(bi);

  const cap = document.createElement('div'); cap.className = 'cap';
  cap.innerHTML = `<b>${S.art}</b> · ${img.naturalWidth}\u00d7${img.naturalHeight}` +
    (artNote ? `<br><span class="warn">${artNote}</span>` : '') +
    `<br>можно перетащить файл сюда. рисунок живёт только в браузере — чтобы значок открылся у других, положите его в badges/ рядом с json`;
  panel.append(cap);

  const h0 = document.createElement('h2'); h0.textContent = 'Заливка'; panel.append(h0);

  const spin = document.createElement('button');
  const setSpin = v => { spinning = v; spin.textContent = v ? 'остановить вращение' : 'вращать'; spin.classList.toggle('on', !v); };
  spin.onclick = () => setSpin(!spinning);
  setSpin(spinning);
  const bar = document.createElement('div'); bar.className = 'bar one'; bar.append(spin);
  panel.append(bar);

  const sw = document.createElement('div'); sw.id = 'swatches';
  for (const p of [...Object.keys(S.enamels || {}), null]) {
    const b = document.createElement('div'); b.className = 'sw';
    b.style.background = p ? S.enamels[p].color
      : 'repeating-linear-gradient(45deg,#c9a227,#c9a227 4px,#8a6d18 4px,#8a6d18 8px)';
    const cap = document.createElement('span'); cap.textContent = p ?? 'металл';
    b.append(cap);
    b.classList.toggle('sel', p === selected);
    b.onclick = () => { selected = p; [...sw.children].forEach(e => e.classList.remove('sel')); b.classList.add('sel'); };
    sw.append(b);
  }
  panel.append(sw, note);

  for (const c of CONTROLS) {
    if (c.length === 1) { const h = document.createElement('h2'); h.textContent = c[0]; panel.append(h); }
    else if (get(c[0]) !== undefined) panel.append(control(c));
  }

  const he = document.createElement('h2'); he.textContent = 'Эмали'; panel.append(he);
  for (const id of Object.keys(S.enamels || {})) {
    panel.append(control([`enamels.${id}.color`, id, 0, 0, 0, 'mat', 'color']));
    panel.append(control([`enamels.${id}.roughness`, `${id} · шероховатость`, 0, 1, 0.01, 'mat']));
  }

  const hx = document.createElement('h2'); hx.textContent = 'Готово'; panel.append(hx);
  const out = document.createElement('textarea'); out.readOnly = true;
  const dump = () => { out.value = JSON.stringify(S, null, 2); };
  const b1 = document.createElement('button'); b1.textContent = 'показать json'; b1.onclick = dump;
  const b2 = document.createElement('button'); b2.textContent = 'копировать';
  b2.onclick = () => { dump(); navigator.clipboard?.writeText(out.value);
    b2.textContent = 'скопировано'; setTimeout(() => b2.textContent = 'копировать', 1200); };
  const b3 = document.createElement('button'); b3.textContent = 'сбросить правки';
  b3.onclick = () => { localStorage.removeItem(KEY); location.reload(); };
  const bb = document.createElement('div'); bb.className = 'bar'; bb.append(b1, b2);
  const bc = document.createElement('div'); bc.className = 'bar one'; bc.append(b3);
  panel.append(bb, bc, out);
}

function refreshPanel() { const y = panel.scrollTop; buildPanel(); panel.scrollTop = y; }

/* ------------------------------------------------------------------ *
 *  Клик по области — заливка выбранным цветом
 * ------------------------------------------------------------------ */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null, hovered = null;

const hit = ev => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(picks, false)[0]?.object ?? null;
};

renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  const moved = !down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4;
  down = null;
  if (moved) return;
  const p = hit(e);
  if (!p) return;
  const cell = p.userData.cell;
  S.regions ??= {};
  if (selected) S.regions[String(cell.index)] = selected; else delete S.regions[String(cell.index)];
  repaint(cell, selected);
  status(); save();
});
renderer.domElement.addEventListener('pointermove', e => {
  const p = hit(e);
  if (hovered && hovered !== p) hovered.material.opacity = 0;
  hovered = p;
  if (p) p.material.opacity = 0.12;
  renderer.domElement.style.cursor = p ? 'pointer' : 'default';
});

/* ------------------------------------------------------------------ *
 *  Старт
 * ------------------------------------------------------------------ */
function resize() {
  const w = BAKE ? BAKE_SIZE : Math.max(320, innerWidth - PANEL),
        h = BAKE ? BAKE_SIZE : innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.domElement.style.left = PANEL + 'px';
}
addEventListener('resize', resize);
resize();

if (BAKE) {
  panel.remove();
  // фон держит html, а не body — без этого omitBackground не даёт альфу
  document.documentElement.style.background = 'transparent';
  document.body.style.background = 'transparent';
}

traceArt();
buildMaterials();
renderer.toneMappingExposure = S.scene?.exposure ?? 0.8;
bloom.strength = S.scene?.bloom ?? 0.2;
build();
if (!BAKE) buildPanel();

if (BAKE) {
  spinning = false;
  window.__bake = {
    setAngle: deg => { angle = deg * Math.PI / 180; pivot.rotation.x = 0; pivot.position.y = 0; },
    regions: regions.length,
    painted: cells.filter(c => c.mesh).length,
    /* Геометрия целиком, вместе с материалами. Свет и окружение в glTF не
       уезжают — вьюер поднимает их сам тем же lib/look.js. */
    stats: () => {
      const by = {};
      badge.traverse(o => { if (!o.geometry) return;
        const n = o.geometry.getAttribute('position').count;
        const k = o.material === metalMat ? 'металл' : 'эмаль';
        by[k] = (by[k] || 0) + n; });
      return by;
    },
    glb: async () => {
      const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
      const { mergeVertices } = await import('three/addons/utils/BufferGeometryUtils.js');
      /* Геометрия строится неиндексированной — каждый треугольник несёт
         свои вершины. Для показа это неважно, а в файле утраивает вес,
         поэтому перед выгрузкой вершины свариваются. */
      badge.traverse(o => { if (o.geometry && !o.geometry.index) o.geometry = mergeVertices(o.geometry, 1e-5); });
      const buf = await new GLTFExporter().parseAsync(badge, { binary: true });
      let s = '', a = new Uint8Array(buf);
      for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode(...a.subarray(i, i + 8192));
      return btoa(s);
    }
  };
}

const clock = new THREE.Clock();
const FIXED = q.get('t');
function tick() {
  const dt = clock.getDelta();
  const spin = S.scene?.spin ?? 0.55;
  if (BAKE) { /* угол ставится снаружи */ }
  else if (FIXED !== null) {
    const t = parseFloat(FIXED);
    angle = t * spin; pivot.rotation.x = Math.sin(t * 0.7) * 0.11;
  } else if (spinning) {
    angle += dt * spin; pivot.rotation.x = Math.sin(clock.elapsedTime * 0.7) * 0.11;
  }
  pivot.rotation.y = angle;
  controls.update();
  // При запекании постобработка не нужна и вредна: блум размазывает альфу
  // по всему кадру. Да и свечение — это свет, пролитый на фон, а фона нет.
  if (BAKE) renderer.render(scene, camera); else composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
