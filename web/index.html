<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Награда — медаль с золотым глобусом</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090a; overflow: hidden; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .18em; text-transform: uppercase;
    color: #4d7a44; pointer-events: none; user-select: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/lib/three/build/three.module.js",
    "three/addons/": "/lib/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">перетащите, чтобы осмотреть · колесо — приблизить</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ *
 *  Сцена, камера, рендерер
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 8.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 18;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key  = new THREE.DirectionalLight(0xfff1dd, 1.0); key.position.set(3.5, 4.5, 5);
const rim  = new THREE.DirectionalLight(0x9dff6a, 0.8); rim.position.set(-4.5, 1.5, -3);
const fill = new THREE.DirectionalLight(0xbdd8ff, 0.45); fill.position.set(-2.5, -3, 4);
scene.add(key, rim, fill);

/* ------------------------------------------------------------------ *
 *  Фон: тёмная сетка с виньеткой
 * ------------------------------------------------------------------ */
function makeBackdrop() {
  const W = 2048, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0d0b'; x.fillRect(0, 0, W, H);
  const step = 64;
  x.lineWidth = 1; x.strokeStyle = 'rgba(80,200,90,0.10)';
  x.beginPath();
  for (let i = 0; i <= W; i += step) { x.moveTo(i + .5, 0); x.lineTo(i + .5, H); }
  for (let j = 0; j <= H; j += step) { x.moveTo(0, j + .5); x.lineTo(W, j + .5); }
  x.stroke();
  x.lineWidth = 1.5; x.strokeStyle = 'rgba(80,200,90,0.20)';
  x.beginPath();
  for (let i = 0; i <= W; i += step * 4) { x.moveTo(i + .5, 0); x.lineTo(i + .5, H); }
  for (let j = 0; j <= H; j += step * 4) { x.moveTo(0, j + .5); x.lineTo(W, j + .5); }
  x.stroke();
  const g = x.createRadialGradient(W / 2, H / 2, H * 0.12, W / 2, H / 2, H * 0.78);
  g.addColorStop(0, 'rgba(10,13,11,0)');
  g.addColorStop(1, 'rgba(4,6,5,0.96)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(64, 32),
  new THREE.MeshBasicMaterial({ map: makeBackdrop() })
);
backdrop.position.z = -9;
scene.add(backdrop);

/* ------------------------------------------------------------------ *
 *  Материалы
 * ------------------------------------------------------------------ */
const M = {
  bronze: new THREE.MeshPhysicalMaterial({
    color: 0xe7b189, metalness: 1, roughness: 0.24, envMapIntensity: 1.1
  }),
  white: new THREE.MeshPhysicalMaterial({
    color: 0xeadfcd, metalness: 0, roughness: 0.16,
    clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 0.9
  }),
  green: new THREE.MeshPhysicalMaterial({
    color: 0x63f01c, metalness: 0, roughness: 0.2,
    clearcoat: 1, clearcoatRoughness: 0.05,
    emissive: 0x2f9c0b, emissiveIntensity: 0.12, envMapIntensity: 1.0
  }),
  black: new THREE.MeshPhysicalMaterial({
    color: 0x0b0e06, metalness: 0, roughness: 0.45,
    clearcoat: 0.35, clearcoatRoughness: 0.1, envMapIntensity: 0.25
  })
};

/* ------------------------------------------------------------------ *
 *  Контуры: скругление углов и эквидистанта.
 *  d > 0 — внутрь, d < 0 — наружу.
 * ------------------------------------------------------------------ */
const V2 = (x, y) => new THREE.Vector2(x, y);

function roundCorners(pts, radii, seg = 7) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const r = radii[i] || 0;
    if (r <= 0) { out.push(p.clone()); continue; }
    const va = a.clone().sub(p), vb = b.clone().sub(p);
    const l = Math.min(r, va.length() * 0.48, vb.length() * 0.48);
    const p1 = p.clone().add(va.normalize().multiplyScalar(l));
    const p2 = p.clone().add(vb.normalize().multiplyScalar(l));
    for (let s = 0; s <= seg; s++) {
      const t = s / seg, u = 1 - t;
      out.push(V2(u * u * p1.x + 2 * u * t * p.x + t * t * p2.x,
                  u * u * p1.y + 2 * u * t * p.y + t * t * p2.y));
    }
  }
  return out;
}

function dedupe(pts) {
  const out = [];
  for (const p of pts) {
    const q = out[out.length - 1];
    if (!q || q.distanceToSquared(p) > 1e-8) out.push(p);
  }
  if (out.length > 1 && out[0].distanceToSquared(out[out.length - 1]) < 1e-8) out.pop();
  return out;
}

function toCCW(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a < 0 ? pts.slice().reverse() : pts;
}

const shapeOf = pts => new THREE.Shape().setFromPoints(pts);
const holeOf  = pts => new THREE.Path().setFromPoints(pts);

function rectPts(x0, y0, x1, y1, r) {
  return toCCW(roundCorners([V2(x1, y0), V2(x1, y1), V2(x0, y1), V2(x0, y0)], [r, r, r, r], 4));
}
function circlePts(cx, cy, r, seg = 108) {
  const p = [];
  for (let i = 0; i < seg; i++) {
    const a = Math.PI / 2 + (i / seg) * Math.PI * 2;
    p.push(V2(cx + r * Math.cos(a), cy + r * Math.sin(a)));
  }
  return p;
}

/* Выдавливание точно в диапазон z: [zA, zB] с фаской по краям. */
function extrude(shape, zA, zB, bevel) {
  const bt = Math.min(bevel, (zB - zA) / 2 - 0.002);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: (zB - zA) - bt * 2,
    bevelEnabled: true, bevelThickness: bt, bevelSize: bevel,
    bevelOffset: 0, bevelSegments: 4, curveSegments: 96
  });
  g.translate(0, 0, zA + bt);
  return g;
}

/* ------------------------------------------------------------------ *
 *  Силуэт значка. Центр медальона — начало координат.
 *  silhouette(d) сразу строит контур, вдвинутый внутрь на d: офсет
 *  готовой ломаной самопересекается там, где радиус скругления
 *  меньше d, а параметрический пересчёт — нет.
 * ------------------------------------------------------------------ */
const R = 1.15;
const Wtop = 0.98, Wmid = 0.88, Wneck = 0.30;
const Ytop = 2.64, Ynotch = 2.005, Yshld = 1.55, Yneck = 1.36;
const FILLET = 0.14;                       // сопряжение перехвата с медальоном

function silhouette(d) {
  const wT = Wtop - d, wM = Wmid - d, wN = Wneck - d;
  const yT = Ytop - d, yN = Ynotch + d;    // ступенька плечика — горизонталь, уходит вверх
  const r = R - d, f = FILLET + d;         // вогнутое сопряжение при вдвигании растёт

  // скос: сдвигаем прямую по нормали и пересекаем с новыми вертикалями
  const A = V2(Wmid, Yshld), B = V2(Wneck, Yneck);
  const u = B.clone().sub(A).normalize();
  const O = A.clone().add(V2(u.y, -u.x).multiplyScalar(d));
  const at = x => V2(x, O.y + (x - O.x) / u.x * u.y);
  const A2 = at(wM), B2 = at(wN);

  const cx = wN + f, cy = Math.sqrt((r + f) ** 2 - cx ** 2);
  const pc = V2(cx, cy).multiplyScalar(r / (r + f));

  const P = [], Rr = [];
  const push = (x, y, rr = 0) => { P.push(V2(x, y)); Rr.push(rr); };
  const cl = v => Math.max(0.015, v);

  push(wT, yT, cl(0.15 - d));
  push(wT, yN, 0.05 + d);                  // вогнутый угол — радиус растёт
  push(wM, yN, cl(0.05 - d));
  push(A2.x, A2.y, cl(0.07 - d));
  push(B2.x, B2.y, cl(0.05 - d));

  const a0 = Math.PI, a1 = Math.atan2(pc.y - cy, pc.x - cx) + Math.PI * 2;
  for (let i = 0; i <= 12; i++) {
    const a = a0 + (a1 - a0) * i / 12;
    push(cx + f * Math.cos(a), cy + f * Math.sin(a));
  }
  const b0 = Math.atan2(pc.y, pc.x), b1 = -Math.PI / 2;
  for (let i = 1; i <= 90; i++) {
    const a = b0 + (b1 - b0) * i / 90;
    push(r * Math.cos(a), r * Math.sin(a));
  }
  for (let i = P.length - 2; i >= 0; i--) { P.push(V2(-P[i].x, P[i].y)); Rr.push(Rr[i]); }
  return toCCW(dedupe(roundCorners(P, Rr, 7)));
}

const OUT = silhouette(0);

/* ------------------------------------------------------------------ *
 *  Сборка. Плашка по силуэту, на ней приподнятое металлическое поле
 *  с проёмами — это и есть векторный контур, — а проёмы залиты эмалью.
 *  Эмаль делается на 2% шире проёма: края уходят под металл, и нигде
 *  не остаётся совпадающих граней.
 * ------------------------------------------------------------------ */
const badge = new THREE.Group();
const pivot = new THREE.Group();
pivot.add(badge);
scene.add(pivot);

const Z_BASE  = 0.10;      // верх плашки, низ рельефа
const Z_FILL  = 0.168;     // верх эмали
const Z_TOP   = 0.205;     // верх металлического рельефа

const metal = (shape, bevel) => badge.add(new THREE.Mesh(extrude(shape, Z_BASE, Z_TOP, bevel), M.bronze));

function enamel(shape, material, grow = 1.02) {
  const g = extrude(shape, Z_BASE, Z_FILL, 0.006);
  g.computeBoundingBox();
  const c = g.boundingBox.getCenter(new THREE.Vector3());
  g.translate(-c.x, -c.y, 0);
  g.scale(grow, grow, 1);
  g.translate(c.x, c.y, 0);
  badge.add(new THREE.Mesh(g, material));
}

// плашка
badge.add(new THREE.Mesh(extrude(shapeOf(OUT), 0, Z_BASE, 0.02), M.bronze));

/* --- нить по краю и белая эмаль вдоль всего контура ---------------- */
const edge = shapeOf(OUT);
edge.holes.push(holeOf(silhouette(0.04)));
metal(edge, 0.014);

const band = shapeOf(silhouette(0.025));
band.holes.push(holeOf(silhouette(0.20)));
enamel(band, M.white, 1.0);        // границы уже перекрывают металл

/* --- внутреннее поле: металл с проёмами под эмаль ------------------ */
const CELLS = [];
const cut = pts => { CELLS.push(pts); return pts; };

const S1 = cut(rectPts(-0.755, 2.215, 0.755, 2.415, 0.03));
const S2 = cut(rectPts(-0.655, 1.97, 0.655, 2.16, 0.03));
const S3 = cut(rectPts(-0.645, 1.725, 0.645, 1.915, 0.03));
const WEDGE = cut(toCCW(roundCorners([
  V2(0.60, 1.675), V2(0.38, 1.60), V2(0.17, 1.53), V2(0.07, 1.49),
  V2(0.00, 1.54),
  V2(-0.07, 1.49), V2(-0.17, 1.53), V2(-0.38, 1.60), V2(-0.60, 1.675)
], [0.04, 0.05, 0.04, 0.025, 0.02, 0.025, 0.04, 0.05, 0.04], 5)));
const F1 = cut(rectPts(0.015, 1.25, 0.070, 1.45, 0.018));
const F2 = cut(rectPts(-0.070, 1.25, -0.015, 1.45, 0.018));

const field = shapeOf(silhouette(0.185));
CELLS.forEach(c => field.holes.push(holeOf(c)));
field.holes.push(holeOf(circlePts(0, 0, 0.93)));
metal(field, 0.012);

enamel(shapeOf(S1), M.green);
enamel(shapeOf(S2), M.black);
enamel(shapeOf(S3), M.green);
enamel(shapeOf(WEDGE), M.black);
enamel(shapeOf(F1), M.green);
enamel(shapeOf(F2), M.green);

/* --- медальон ------------------------------------------------------ */
const blackRing = shapeOf(circlePts(0, 0, 0.945));
blackRing.holes.push(holeOf(circlePts(0, 0, 0.745)));
enamel(blackRing, M.black, 1.0);

const goldRing = shapeOf(circlePts(0, 0, 0.755));
goldRing.holes.push(holeOf(circlePts(0, 0, 0.715)));
metal(goldRing, 0.012);

enamel(shapeOf(circlePts(0, 0, 0.725)), M.green, 1.0);

/* ------------------------------------------------------------------ *
 *  Золотой глобус вместо мяча.
 *  Материки — рельеф: карта смещения по упрощённым контурам
 *  в равнопромежуточной проекции.
 * ------------------------------------------------------------------ */
const CONTINENTS = {
  africa: [[-17,15],[-16,21],[-11,27],[-2,32],[10,37],[20,33],[32,31],[35,24],[43,12],[51,12],[43,-1],[40,-11],[35,-20],[32,-26],[27,-33],[20,-35],[16,-29],[13,-19],[11,-9],[9,-1],[9,4],[3,6],[-5,5],[-9,4],[-13,9],[-17,15]],
  eurasia: [[-9,36],[-9,44],[-2,48],[4,52],[8,57],[11,58],[14,55],[20,55],[22,59],[27,60],[29,66],[24,70],[33,70],[42,68],[56,68],[70,73],[82,74],[95,76],[110,76],[125,73],[140,72],[145,60],[157,61],[160,60],[155,52],[142,46],[135,43],[130,42],[128,35],[122,30],[120,22],[110,20],[105,10],[100,6],[98,12],[92,21],[88,22],[80,15],[77,8],[72,20],[66,24],[60,25],[52,29],[48,30],[45,37],[36,36],[28,37],[20,40],[14,38],[12,45],[3,43],[-2,43],[-9,36]],
  namerica: [[-168,66],[-160,70],[-140,70],[-125,70],[-110,68],[-95,68],[-85,70],[-75,73],[-65,66],[-60,55],[-65,48],[-70,44],[-74,40],[-76,35],[-81,31],[-80,25],[-85,30],[-90,29],[-95,29],[-97,26],[-97,20],[-95,16],[-92,15],[-85,15],[-83,9],[-78,9],[-83,15],[-90,17],[-105,20],[-110,24],[-115,30],[-120,34],[-124,40],[-124,48],[-130,54],[-140,60],[-150,60],[-160,55],[-165,60],[-168,66]],
  samerica: [[-78,8],[-72,11],[-62,10],[-52,5],[-50,0],[-44,-2],[-38,-5],[-35,-8],[-38,-13],[-40,-20],[-48,-25],[-53,-34],[-58,-38],[-62,-41],[-65,-45],[-68,-52],[-70,-55],[-73,-50],[-73,-42],[-72,-35],[-70,-25],[-70,-18],[-75,-14],[-79,-6],[-80,-2],[-78,2],[-78,8]],
  australia: [[113,-22],[114,-26],[118,-34],[125,-33],[131,-32],[137,-33],[140,-38],[146,-39],[150,-37],[153,-28],[153,-25],[148,-20],[143,-14],[136,-12],[130,-12],[126,-14],[122,-17],[113,-22]],
  greenland: [[-45,60],[-30,68],[-20,70],[-18,76],[-30,83],[-45,83],[-58,82],[-62,76],[-55,68],[-45,60]],
  antarctica: [[-180,-70],[180,-70],[180,-90],[-180,-90],[-180,-70]]
};

function makeGlobeMap({ ocean, land, grid, blur = 0 }) {
  const W = 2048, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const P = (lon, lat) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];

  x.fillStyle = ocean; x.fillRect(0, 0, W, H);
  if (blur) x.filter = 'blur(' + blur + 'px)';
  x.fillStyle = land;
  for (const poly of Object.values(CONTINENTS)) {
    x.beginPath();
    poly.forEach(([lon, lat], i) => { const [px, py] = P(lon, lat); i ? x.lineTo(px, py) : x.moveTo(px, py); });
    x.closePath(); x.fill();
  }
  x.strokeStyle = grid; x.lineCap = 'round';
  for (let lon = -180; lon <= 180; lon += 30) {
    x.lineWidth = 4;
    x.beginPath(); x.moveTo(P(lon, 90)[0], 0); x.lineTo(P(lon, -90)[0], H); x.stroke();
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    x.lineWidth = lat === 0 ? 8 : 4;
    const y = P(0, lat)[1];
    x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke();
  }
  x.filter = 'none';

  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const globeColor = makeGlobeMap({ ocean: '#d9a54a', land: '#ffe8ab', grid: '#7d5718' });
globeColor.colorSpace = THREE.SRGBColorSpace;
const globeRough = makeGlobeMap({ ocean: '#1c1c1c', land: '#5e5e5e', grid: '#3c3c3c' });
const globeDisp  = makeGlobeMap({ ocean: '#000000', land: '#b6b6b6', grid: '#efefef', blur: 3 });

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(0.665, 256, 128),
  new THREE.MeshPhysicalMaterial({
    map: globeColor, roughnessMap: globeRough,
    displacementMap: globeDisp, displacementScale: 0.034,
    color: 0xffffff, metalness: 0.9, roughness: 0.85, envMapIntensity: 3.0
  })
);
globe.position.set(0, 0, 0.17);
globe.rotation.z = THREE.MathUtils.degToRad(23.4);
badge.add(globe);

badge.position.y = -(Ytop - R) / 2;

/* ------------------------------------------------------------------ *
 *  Постобработка и анимация
 * ------------------------------------------------------------------ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.20, 0.4, 1.0));
composer.addPass(new OutputPass());

const clock = new THREE.Clock();
const FIXED_T = new URLSearchParams(location.search).get('t');  // ?t=3 — застывший кадр
function tick() {
  const t = FIXED_T !== null ? parseFloat(FIXED_T) : clock.getElapsedTime();
  pivot.rotation.y = t * 0.55;
  pivot.rotation.x = Math.sin(t * 0.7) * 0.11;
  pivot.position.y = Math.sin(t * 0.9) * 0.05;
  globe.rotation.y = -t * 0.35;
  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
